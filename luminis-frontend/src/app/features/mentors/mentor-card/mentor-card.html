<div class="card card-luminis h-100 mentor-card">

  <div class="card-body p-4 d-flex flex-column align-items-center text-center">

    <!-- FOTO -->
    <div class="mentor-foto-wrapper mb-3">

      <img
        [src]="
          mentora.usuarioId.fotoPerfil
            ? (
                mentora.usuarioId.fotoPerfil.startsWith('http')
                  ? mentora.usuarioId.fotoPerfil
                  : 'assets/' + mentora.usuarioId.fotoPerfil
              )
            : 'assets/default-avatar.png'
        "
        [alt]="mentora.usuarioId.nombre"
        class="mentor-avatar"
      />

    </div>

    <!-- INFO -->
    <h5 class="fw-bold mb-1">
      {{ mentora.usuarioId.nombre }}
    </h5>

    <p class="text-muted small mb-1">
      {{ mentora.puesto || 'Mentora' }}
    </p>

    <p class="text-muted small mb-3">
      <i class="bi bi-building me-1"></i>
      {{ mentora.empresa || 'Empresa no especificada' }}
    </p>

    <!-- ESPECIALIDADES -->
    <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">

      @for (area of mentora.especialidades; track area._id) {

        <span class="badge-area">
          {{ area.nombre }}
        </span>

      }

    </div>

    <!-- BOTON -->
    <a
      [routerLink]="['/mentors', mentora._id]"
      class="btn btn-luminis-primary w-100 mt-auto"
    >
      Ver Perfil
    </a>

  </div>

</div>
